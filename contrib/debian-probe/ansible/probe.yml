# Provision Debian lab probes (contrib/debian-probe, docs/debian-probe.md).
#
#   cd contrib/debian-probe/ansible
#   ansible-playbook -i inventory.yml probe.yml
#
# See inventory.example.yml for the variables a probe needs.
- name: Debian lab probe
  hosts: debian_probes
  become: true
  roles:
    - debian_probe
