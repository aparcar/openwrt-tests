name: Formal tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # As in .python-version; environment variables override uv.toml's
  # system-only Python preference
  UV_PYTHON: "3.14"
  UV_PYTHON_PREFERENCE: managed

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # ruff as pinned in the dev group, without the project's own deps.
      # Import order is ruff's job (I001); isort is not run, its default
      # style disagrees with ruff's.
      - name: Install ruff
        run: uv sync --only-group dev

      - name: Lint with ruff
        run: uv run --no-sync ruff check --output-format github .

      - name: Stylecheck with ruff
        run: uv run --no-sync ruff format --check .
