# Lab hosts: labgrid exporter + coordinator, pdudaemon, TFTP, DUT VLANs and
# the labgrid-dev developer account (role labgrid_lab).
#
#   uv run ansible-playbook lab.yml --limit labgrid-<lab>
#   uv run ansible-playbook lab.yml --limit labgrid-<lab> --tags export   # exporter/places only
#
# The kernelci agent (role labgrid_agent) is deployed from openwrtci, which
# holds the lab's tokens. See README.md.

- name: Lab hosts
  hosts: labs
  become: true
  vars:
    labnet: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../labnet.yaml') | from_yaml }}"
  roles:
    - role: labgrid_lab
    # - role: labgrid_agent
