# Lab hosts: labgrid exporter + coordinator, pdudaemon, TFTP, DUT VLANs, the
# labgrid-dev developer account and automatic upgrades (role labgrid_lab;
# labgrid_lab_openwrt on lab hosts that run OpenWrt, see
# docs/openwrt-lab-host.md), plus the kernelci agent (role labgrid_agent) on
# hosts with labgrid_agent_lab_name.
#
#   uv run ansible-playbook lab.yml --limit labgrid-<lab>
#   uv run ansible-playbook lab.yml --limit labgrid-<lab> --tags export   # exporter/places only
#   uv run ansible-playbook lab.yml --limit labgrid-<lab> --tags agent-code
#       # only update the agent's openwrt-tests and kernelci-labgrid checkouts
#       # (and their venvs); the next poll runs the new code
#
# The agent's tokens come from openwrtci (server.yml writes them to its
# secrets directory, labgrid_agent_secrets_dir). See README.md.
#
# Probes (wired, Wi-Fi, or the wired one on an OpenWrt lab host) aren't
# managed here: contrib/labgrid-probe/install-probe.sh.

# OpenWrt lab hosts need python3 (and sudo) before Ansible can gather facts
# (tagged always, so --tags export/agent/... still bootstraps)
- name: Python for Ansible on OpenWrt lab hosts
  hosts: labs
  gather_facts: false
  tags: always
  tasks:
    - name: Bootstrap OpenWrt
      ansible.builtin.import_role:
        name: labgrid_lab_openwrt
        tasks_from: bootstrap

- name: Lab hosts
  hosts: labs
  become: true
  vars:
    labnet: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../labnet.yaml') | from_yaml }}"
  roles:
    - role: labgrid_lab
      when: ansible_os_family != 'OpenWrt'
    - role: labgrid_lab_openwrt
      when: ansible_os_family == 'OpenWrt'
    - role: labgrid_agent
      when: labgrid_agent_lab_name is defined
      tags: agent
