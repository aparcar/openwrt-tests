## These consoles hang off an 8-port WCH CH348 adapter driven by the out-of-tree
## ch9344 driver. All 8 ports share ONE USB interface, and ch9344 registers its
## ttys directly on it, so there is no per-port `port_number` sysfs attr (and no
## /dev/serial/by-path link). The driver names ttys ttyCH9344USB<8*chip+port>, so
## with a single adapter the node is stable; @ID_PATH scopes to that adapter so a
## renumbered node fails to match instead of selecting the wrong console.
## (labgrid renders this file with jinja2; '#' is a statement, '##' a comment.)
labgrid-bryan-glinet_gl-mt6000:
  location: labgrid-bryan
  USBSerialPort:
    match:
      "@ID_PATH": "platform-xhci-hcd.0-usb-0:2"
      DEVNAME: "/dev/ttyCH9344USB0"
    speed: 115200
  PDUDaemonPort:
    host: localhost:16421
    pdu: bryan-gpio
    index: 1
  TFTPProvider:
    internal: "/srv/tftp/glinet_gl-mt6000"
    external: "tftp://192.168.101.1/glinet_gl-mt6000"
  NetworkService:
    address: "192.168.1.1%vlan102"
    username: "root"

