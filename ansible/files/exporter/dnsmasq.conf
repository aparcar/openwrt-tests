# Static config — no templating. config-sync fetches this file verbatim.
#
# TFTP only: the lab host serves no DHCP on any VLAN.
# - DUT LAN VLANs: the DUT is the only DHCP server there. U-Boot uses static
#   addresses (serverip 192.168.<VLAN>.1, ipaddr .2, set by the strategy from
#   the tftp:// URL in exporter.yaml).
# - DUT WAN VLANs: addresses come from the test setup (e.g. the labgrid
#   probe), not from here.
#
# We always list 24 VLANs (vlan101–vlan124) plus vlan200. Listing VLANs a
# given host doesn't have is harmless: bind-dynamic makes dnsmasq bind each
# interface only if/when it exists, instead of failing at startup on a missing
# one. Keep this in lockstep with netplan (which also creates 24). The list
# also keeps TFTP off the management uplink and Wi-Fi.

# Turn off DNS functionality
port=0

# Bind interfaces dynamically so absent/late VLANs don't abort startup.
bind-dynamic

# Interfaces to serve (TFTP) — vlan101 .. vlan124, vlan200. No dhcp-range:
# without one, dnsmasq doesn't do DHCP.
interface=vlan101
interface=vlan102
interface=vlan103
interface=vlan104
interface=vlan105
interface=vlan106
interface=vlan107
interface=vlan108
interface=vlan109
interface=vlan110
interface=vlan111
interface=vlan112
interface=vlan113
interface=vlan114
interface=vlan115
interface=vlan116
interface=vlan117
interface=vlan118
interface=vlan119
interface=vlan120
interface=vlan121
interface=vlan122
interface=vlan123
interface=vlan124
interface=vlan200

# TFTP configuration
enable-tftp
tftp-root=/srv/tftp/
