# DUT VLANs only (role labgrid_lab writes this to /etc/netplan/labnet.yaml).
# The host's own network (management port, Wi-Fi, ...) belongs in its own
# netplan file, set up by the lab's admin; it must define {{ vlan_interface }}.
network:
  version: 2
  vlans:
{% for vlan in range(0, 24) %}
    vlan{{ vlan + 101 }}:
      id: {{ vlan + 101 }}
      link: {{ vlan_interface }}
      addresses:
          - 192.168.{{ vlan + 101 }}.1/24
          - 192.168.1.{{ vlan + 101 }}/24
{% endfor %}
    vlan200:
      id: 200
      link: {{ vlan_interface }}
      addresses:
          - 192.168.200.1/24
          - 192.168.1.200/24
