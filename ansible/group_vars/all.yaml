# The kernelci agent (role labgrid_agent) on hosts with
# labgrid_agent_lab_name: tokens come from openwrtci, whose server.yml
# writes them to <secrets>/labs/<lab>.env (this checkout sits in openwrtci
# as tests/).
labgrid_agent_secrets_dir: "{{ playbook_dir }}/../../ansible/secrets/openwrtci.aparcar.org"
labgrid_agent_pool: openwrt-labs
