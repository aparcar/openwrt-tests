# Own names: labgrid_lab's handlers (systemd) are loaded in the same play
- name: Restart labgrid-exporter (procd)
  community.general.openwrt_init:
    name: labgrid-exporter
    state: restarted

- name: Restart labgrid-coordinator (procd)
  community.general.openwrt_init:
    name: labgrid-coordinator
    state: restarted

- name: Restart dnsmasq (procd)
  community.general.openwrt_init:
    name: dnsmasq
    state: restarted

- name: Restart labgrid-tftp (procd)
  community.general.openwrt_init:
    name: labgrid-tftp
    state: restarted
