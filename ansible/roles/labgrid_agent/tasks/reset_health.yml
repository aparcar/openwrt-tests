# Make the agent forget its device health, so it checks every device again
# right away and reports the results. Used by reset-health.yml.
#
# The agent keeps the health state in memory (and in health.json): it looks
# for health.reset next to it once per poll, removes it and starts over.
# Running jobs aren't touched. Same on systemd and procd.

- name: Ask the agent to reset its health state
  ansible.builtin.file:
    path: "{{ labgrid_agent_state_dir }}/health.reset"
    state: touch
    owner: "{{ labgrid_agent_user }}"
    group: "{{ labgrid_agent_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Wait for the agent to pick it up
  ansible.builtin.stat:
    path: "{{ labgrid_agent_state_dir }}/health.reset"
  register: _agent_reset
  until: not _agent_reset.stat.exists
  retries: "{{ (labgrid_agent_reset_health_timeout / 10) | int }}"
  delay: 10
