- name: Restart rpcd (labgrid-probe)
  community.general.openwrt_init:
    name: rpcd
    state: restarted

- name: Restart uhttpd (labgrid-probe)
  community.general.openwrt_init:
    name: uhttpd
    state: restarted

- name: Reload the firewall (labgrid-probe)
  community.general.openwrt_init:
    name: firewall
    state: reloaded
