# Computed when used (only in local mode: a probe of its own has no exporter)
_probe_exporter: "{{ lookup('ansible.builtin.template', labgrid_probe_exporter) | from_yaml }}"

# local mode: the host's DUT interfaces, the only parents slots may use. From
# the DUTs' NetworkServices (192.168.1.1%<dev>) and NetworkInterfaces.
_parents_json: >-
  {%- set out = [] -%}
  {%- for group in _probe_exporter.values() if group is mapping -%}
  {%- for name, res in group.items() if res is mapping -%}
  {%- set cls = res.cls | default(name) -%}
  {%- if cls == 'NetworkService' and '%' in (res.address | default('') | string) -%}
  {%- set _ = out.append(res.address.split('%')[-1]) -%}
  {%- elif cls == 'NetworkInterface' and res.ifname is defined -%}
  {%- set _ = out.append(res.ifname) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out | unique | list | to_json }}
_parents: "{{ (_parents_json | from_json) if labgrid_probe_mode == 'local' else [] }}"

_probe_pkgs: "{{ labgrid_probe_packages + (labgrid_probe_local_packages if labgrid_probe_mode == 'local' else []) }}"
