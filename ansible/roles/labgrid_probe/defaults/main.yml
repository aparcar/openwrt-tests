# labgrid_probe: the labgrid-probe (contrib/labgrid-probe) on an OpenWrt
# host. Two modes:
#
#   trunk  a probe of its own (GL-MT2500, group `probes`): slots are VLANs on
#          its trunk port; tests reach it over the lab network
#   local  on an OpenWrt lab host (labgrid_lab_openwrt; lab.yml applies it
#          to lab hosts with `labgrid_probe_on_host: true`): slots are
#          macvlans on the host's own DUT interfaces, tests reach it on
#          127.0.0.1 through the exporter
#
# The lab's labnet.yaml entry needs `probe: true` (place labgrid-<lab>-probe,
# tag role=probe), its exporter.yaml the probe's NetworkService.

labgrid_probe_mode: trunk

labgrid_probe_files: "{{ playbook_dir }}/../contrib/labgrid-probe/files"

labgrid_probe_packages:
  - ip-full
  - iperf3
  - kmod-veth
  - ucode
  - ucode-mod-fs
  - ucode-mod-uci
  - ucode-mod-socket
  - ucode-mod-struct
  - rpcd
  - rpcd-mod-ucode
  - uhttpd
  - uhttpd-mod-ubus
# local mode: slots are macvlans
labgrid_probe_local_packages:
  - kmod-macvlan

# trunk mode: also install the probe's own network, firewall and system config
# (files/etc). Replaces the device's config; the network
# config applies at the next reboot.
labgrid_probe_config: false

# --- local mode -----------------------------------------------------------

# The lab's exporter.yaml: the slots' parents are the interfaces of its DUTs'
# NetworkServices (192.168.1.1%<dev>) and "wan" NetworkInterfaces
labgrid_probe_exporter: "{{ playbook_dir }}/files/exporter/{{ inventory_hostname }}/exporter.yaml"
# An extra uhttpd instance for the probe, on loopback only (the exporter's
# NetworkService for the probe place points here). rpcd's ACL lets the
# unauthenticated session call labgrid-probe on every uhttpd with /ubus,
# so other instances (LuCI's) expose it on their addresses too.
labgrid_probe_http_port: 8080
# Firewall zone the DUTs' internet uplinks (veths pbx<N>) are forwarded and
# masqueraded to
labgrid_probe_uplink_zone: wan
