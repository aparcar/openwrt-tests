# labgrid_lab: a lab host (labgrid exporter, coordinator, pdudaemon, TFTP,
# DUT VLANs). See ansible/README.md for the account model.

# --- Accounts -----------------------------------------------------------------

# Shared developer login: device access and labgrid, nothing else. Its SSH
# keys include the GitHub keys of the host's labgrid_access, in an
# Ansible-managed block (tasks/github_keys.yml); other keys are left alone.
labgrid_dev_user: labgrid-dev
# labgrid_access: GitHub user names whose keys may log in as labgrid-dev and
# the probe accounts. Required in host_vars (not public); no default, so a
# missing list stops the run instead of removing everyone's keys.
# labgrid_access_keys: optional, whole authorized_keys lines for keys not on
# GitHub (e.g. a build box), same accounts as labgrid_access.
# Group shared by everyone who runs labgrid on this host (developers and the
# kernelci agent): owns the TFTP tree and labgrid's staging cache.
labgrid_group: labgrid
# Device groups the labgrid users need: labgrid runs usbsdmux, dd/bmaptool,
# uhubctl, ... over SSH as the logged-in user.
labgrid_device_groups: [dialout, plugdev]
# System accounts running the daemons (no login, no shell)
labgrid_exporter_user: labgrid-exporter
labgrid_coordinator_user: labgrid-coordinator

# --- labgrid --------------------------------------------------------------

# CLI tools, installed with `uv tool install` (name: source spec). labgrid is
# the same commit the tests use (pyproject.toml / uv.lock), so client and
# exporter/coordinator don't drift apart: bump both together. A spec equal to
# the name installs the latest release.
labgrid_uv_tools:
  labgrid: git+https://github.com/aparcar/labgrid.git@475a767ba42ae453a6d6a82c6c485783f846d50f
  usbsdmux: usbsdmux
  # upstream main plus the sysfsgpio and shelly_ble drivers, ubus login and the
  # tasmota single-outlet fix. A branch is followed: every run (also
  # `--tags agent-code`) updates the tool to the branch's current head.
  pdudaemon: git+https://github.com/aparcar/pdudaemon.git@staging
# Extra packages for a tool's venv (name: [packages], `uv tool install --with`)
labgrid_uv_tools_with:
  pdudaemon: "{{ ['bleak'] if pdudaemon_bluetooth else [] }}"

# uv itself, its tool venvs, their entry points, and Python builds uv
# downloads (outside root's home, so the service accounts can use them)
uv_install_dir: /usr/local/bin
uv_tool_dir: /opt/uv/tools
uv_tool_bin_dir: /usr/local/bin
uv_python_dir: /opt/uv/python

labgrid_config_dir: /etc/labgrid
labgrid_coordinator_dir: /var/lib/labgrid-coordinator
labgrid_tftp_root: /srv/tftp
# labgrid stages files below <cache>/<local user>/ on the exporter
labgrid_cache_dir: /var/cache/labgrid
labgrid_cache_max_age_days: 7

# Files shared by all labs (dnsmasq.conf and pdudaemon.conf defaults, netplan,
# udev rules). Per-lab files are in labs/<lab>/ (labgrid_lab_dir, lab.yml).
labgrid_lab_data_dir: "{{ playbook_dir }}/files/exporter"

# --- Lab network ------------------------------------------------------------

# Interface the DUT VLANs are tagged on. It must be defined in the host's own
# netplan file (the admin's); the role only writes the VLANs.
vlan_interface: eth0
# Netplan file holding only the DUT VLANs (files/exporter/netplan.yaml)
labgrid_netplan_file: /etc/netplan/labnet.yaml
# DUT VLANs on vlan_interface. VLAN N gets 192.168.N.1/24 (TFTP, WAN upstream)
# and 192.168.1.N/24 (to reach the DUT), so N must be below 255 and
# 192.168.N.0/24 must not be a network the host already uses (e.g. its
# management network). A lab with more switch ports lists more in host_vars.
labgrid_dut_vlans: "{{ range(101, 125) | list + [200] }}"
# Lab equipment to name in the host's /etc/hosts (name: address), so
# pdudaemon.conf and exporter.yaml can call a PDU by name
labgrid_hosts: {}
# System account running pdudaemon
pdudaemon_user: pdudaemon
# Optional extra PDU device groups for pdudaemon (e.g. [gpio, i2c]); they must
# exist on the host
# pdudaemon_groups: []
# PDUs switched over Bluetooth LE (pdudaemon's shelly_ble driver): installs
# BlueZ and bleak and lets pdudaemon use the host's Bluetooth adapter
pdudaemon_bluetooth: false

# Account the tests log in as to run iprobe (lab.yaml iphone_probe,
# tasks/iphone_probe.yml); the exporter's NetworkService uses it
iphone_probe_user: iprobe
iphone_probe_pymobiledevice3_version: "11.60.0"
# Account the tests log in as to run aprobe (lab.yaml android_probe,
# tasks/android_probe.yml); the exporter's NetworkService uses it
android_probe_user: aprobe

# CH348 octal serial adapters (ch9344 out-of-tree driver)
ch348_module_enabled: false
