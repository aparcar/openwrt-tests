- name: Check this host is a lab in labs/
  ansible.builtin.assert:
    that: (labgrid_lab_dir ~ '/lab.yaml') is file
    fail_msg: "{{ inventory_hostname }} has no labs/{{ inventory_hostname }}/lab.yaml"
    quiet: true
  tags: always

- name: Base system
  ansible.builtin.import_tasks: base.yml

- name: Accounts and shared directories
  ansible.builtin.import_tasks: accounts.yml
  tags: accounts

- name: Install labgrid and pdudaemon
  ansible.builtin.import_tasks: labgrid.yml

- name: Coordinator
  ansible.builtin.import_tasks: coordinator.yml

- name: Exporter
  ansible.builtin.import_tasks: exporter.yml

- name: Lab network (netplan, dnsmasq, forwarding)
  ansible.builtin.import_tasks: network.yml

- name: Devices (udev, serial drivers)
  ansible.builtin.import_tasks: devices.yml

- name: iPhone Wi-Fi probe (pymobiledevice3, iprobe)
  ansible.builtin.import_tasks: iphone_probe.yml
  when: lab.iphone_probe is defined
  vars:
    _iphone_probe: "{{ lab.iphone_probe }}"
  tags: iphone-probe

- name: Android Wi-Fi probe (adb, aprobe)
  ansible.builtin.import_tasks: android_probe.yml
  when: lab.android_probe is defined
  vars:
    _android_probe: "{{ lab.android_probe }}"
  tags: android-probe
