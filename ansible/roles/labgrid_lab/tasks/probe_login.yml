# The SSH login of a probe's account (_probe_user) that runs its probe CLI
# (_probe_command in /usr/local/bin, or dprobe through sudo) and nothing
# else: sshd forces probe-ssh (contrib/probe-ssh) on it. Behind that, the
# lab's GitHub users (as for labgrid-dev, github_keys.yml) may log in as
# _probe_user too; the labgrid_agent role adds the agent's key. Also used by
# contrib/debian-probe's debian_probe role (_probe_ssh_src, its own playbook).

- name: Install probe-ssh, the only command a probe's login runs
  ansible.builtin.copy:
    src: "{{ _probe_ssh_src | default(playbook_dir ~ '/../contrib/probe-ssh/probe_ssh.py') }}"
    dest: /usr/local/sbin/probe-ssh
    mode: "0755"

# A Match block in an included file ends with the file
- name: Restrict {{ _probe_user }}'s SSH login to {{ _probe_command }}
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (openwrt-tests): this login runs {{ _probe_command }} only
      Match User {{ _probe_user }}
          ForceCommand /usr/local/sbin/probe-ssh {{ _probe_command }}
          DisableForwarding yes
          PermitTTY no
    dest: /etc/ssh/sshd_config.d/50-{{ _probe_user }}.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# The effective config: the forced command reaches the probe's user and no
# one else (a Match block that leaked past its file would capture the rest
# of sshd_config)
- name: Check sshd forces probe-ssh on {{ _probe_user }} only
  ansible.builtin.command: /usr/sbin/sshd -T -C user={{ item.user }},host=localhost,addr=127.0.0.1
  # labgrid_dev_user only on lab hosts, not on a dprobe box
  loop: >-
    {{ [{'user': _probe_user, 'forced': true}, {'user': 'root', 'forced': false}]
       + ([{'user': labgrid_dev_user, 'forced': false}] if labgrid_dev_user is defined else []) }}
  register: _sshd_effective
  changed_when: false
  failed_when: >-
    _sshd_effective.rc != 0
    or ('/usr/local/sbin/probe-ssh ' ~ _probe_command in _sshd_effective.stdout) != item.forced

- name: Let the lab's GitHub users run {{ _probe_command }}
  ansible.builtin.import_tasks: github_keys.yml
  vars:
    _keys_user: "{{ _probe_user }}"
