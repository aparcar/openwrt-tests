# Automatic upgrades with unattended-upgrades: security and point-release
# updates, including new kernels, daily; removes unused dependencies and old
# kernels; reboots at labgrid_lab_upgrades_reboot_time when an upgrade needs
# it (e.g. a new kernel). Jobs running then go back to the CI queue.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-listchanges]
    update_cache: true
    cache_valid_time: 3600

- name: Run apt update and unattended-upgrade daily
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (openwrt-tests, role labgrid_lab)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 52labgrid-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52labgrid-unattended-upgrades
    mode: "0644"

# Earlier written by openwrtci's lab.yml (role upgrades)
- name: Remove openwrtci's unattended-upgrades config
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52openwrtci-unattended-upgrades
    state: absent

- name: Enable the apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
