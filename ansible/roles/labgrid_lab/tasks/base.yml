- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - microcom
      - ser2net
      - rsync
      - socat
      - iptables
      - iptables-persistent
      - git
      - sudo
      - acl
      - pkg-config
      - libsystemd-dev
      - build-essential
      - python3-dev
      - nmap
      - dnsmasq
    state: present
    update_cache: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127.0.0.1"
    line: "127.0.0.1 localhost"
    state: present

# sshd uses the first value it sees, so the 00- prefix wins over other
# drop-ins (e.g. cloud-init's 50-cloud-init.conf enabling passwords).
- name: Allow only key-based SSH logins
  ansible.builtin.copy:
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    dest: /etc/ssh/sshd_config.d/00-key-only.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
