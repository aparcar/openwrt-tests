# Fresh health checks in every lab: each agent forgets its device health state
# (role labgrid_agent, tasks/reset_health.yml) at its next poll and checks
# every device again, reporting the results to the CI server. Devices busy
# with a job are checked once it's done; nothing else of the lab is changed.
#
#   uv run ansible-playbook reset-health.yml
#   uv run ansible-playbook reset-health.yml --limit labgrid-<lab>

- name: Reset the agents' health state
  hosts: labs
  become: true
  tasks:
    - name: Reset the health state
      ansible.builtin.include_role:
        name: labgrid_agent
        tasks_from: reset_health
      when: labgrid_agent_lab_name is defined
