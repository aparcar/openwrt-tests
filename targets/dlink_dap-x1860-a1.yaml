openwrt:
  name: D-Link DAP-X1860 A1
  target: ramips-mt7621
  profile: dlink_dap-x1860-a1
targets:
  main:
    features:
      - wan_port
      - wifi-2g
      - wifi-5g
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      - PDUDaemonDriver: {}
      - TFTPProviderDriver: {}
      - SerialDriver:
          txdelay: 0.01
      - UBootDriver:
          # "stop autoboot" appears twice (U-Boot countdown, then the boot
          # menu); only interrupt the menu, where "0" selects the U-Boot
          # console. A second "0" would be left on the "=>" command line.
          autoboot: "U-Boot Boot Menu"
          interrupt: "0"
          prompt: "=>"
          init_commands:
            - tftpboot
          boot_command: bootm $loadaddr
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - UBootTFTPStrategy: {}
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
