# Bring-up only: no published image yet (openwrt/openwrt#26119), so pass a self-built initramfs as LG_IMAGE
openwrt:
  name: Ubiquiti UniFi Cloud Gateway Fiber
  target: qualcommbe-ipq95xx
  profile: ubnt_ucgfiber
  # loop cables sfp1<->lan2, lan3<->sfp2 for test_kselftest_dsa_loops
  # ([h1, swp1, swp2, h2]); the image must keep them out of the bridges
  kselftest_loops: [sfp1, lan2, lan3, sfp2]
targets:
  main:
    features:
      - wan_port
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      - PDUDaemonDriver: {}
      - TFTPProviderDriver: {}
      - SerialDriver:
          # at 0.01 the shell lost the first character after login
          txdelay: 0.05
      - UBootDriver:
          prompt: "IPQ9574# "
          # the RAM boot of openwrt/openwrt#26119
          init_commands:
            - setenv bootargs console=ttyMSM0,115200n8
            - tftpboot 0x50000000 $bootfile
          boot_command: bootm 0x50000000
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - UBootTFTPStrategy: {}
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
