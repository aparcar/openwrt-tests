targets:
  main:
    features:
      - kernel-selftests
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      PDUDaemonDriver: {}
      SerialDriver:
        txdelay: 0.01
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      USBSDMuxDriver: {}
      USBStorageDriver: {}
      SDMuxStrategy: {}

images:
  root: !template $LG_IMAGE

imports:
  - ../strategies/sdmuxstrategy.py
