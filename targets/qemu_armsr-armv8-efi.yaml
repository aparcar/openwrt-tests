openwrt:
  name: QEMU Arm 64-bit (EFI)
  target: armsr-armv8
  profile: generic
  image:
    type: combined-efi
    filesystem: squashfs
  # UEFI firmware (edk2/AAVMF) for the QEMUDriver `bios` image, see conftest.py
  efi_firmware: aarch64
targets:
  main:
    features:
      - wan_port
      - rootfs
      - sysupgrade
    resources:
      - NetworkService:
          # The actual address will be filled in by the strategy
          address: ""
          port: 22
          username: root
    drivers:
      - QEMUDriver:
          qemu_bin: qemu_bin
          machine: virt
          cpu: cortex-a57
          # 128M is too little for sysupgrade: with 32 MiB CMA reserved, stage2
          # is OOM-killed while extracting the new ESP to /tmp
          # ("sysupgrade aborted with return code: 9")
          memory: 256M
          extra_args: "-device virtio-rng-pci -netdev user,id=wan -device virtio-net-pci,netdev=wan"
          nic: user,model=virtio-net-pci,net=192.168.1.0/24,id=lan
          bios: bios
          disk: firmware
          # Writes (overlay, sysupgrade) go to a temporary overlay that lives
          # as long as QEMU, not into the firmware file
          disk_opts: snapshot=on
      - ShellDriver:
          login_prompt: Please press Enter to activate this console.
          prompt: 'root@[\w()]+:[^ ]+ '
          await_login_timeout: 15
          username: root
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
      - QEMUNetworkStrategy: {}
tools:
  qemu_bin: qemu-system-aarch64
imports:
  - ../strategies/qemunetworkstrategy.py
