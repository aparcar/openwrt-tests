openwrt:
  name: QEMU Arm 32-bit (EFI)
  target: armsr-armv7
  profile: generic
  image:
    type: combined-efi
    filesystem: squashfs
  # UEFI firmware (edk2/AAVMF32); conftest.py adds it as pflash drives (code,
  # vars): with -bios and no variable store edk2 stalls after its banner in
  # some boots
  efi_firmware: arm
targets:
  main:
    features:
      - wan_port
      - rootfs
      - sysupgrade
    resources:
      - NetworkService:
          # The actual address will be filled in by the strategy
          address: ""
          port: 22
          username: root
    drivers:
      - QEMUDriver:
          qemu_bin: qemu_bin
          machine: virt
          cpu: cortex-a15
          # At 128M the EFI stub fails with "Unable to allocate memory for
          # uncompressed kernel": edk2 leaves no free block large enough for
          # the decompressed kernel. 256M boots.
          memory: 256M
          extra_args: "-device virtio-rng-pci -netdev user,id=wan -device virtio-net-pci,netdev=wan"
          nic: user,model=virtio-net-pci,net=192.168.1.0/24,id=lan
          disk: firmware
          # Writes (overlay, sysupgrade) go to a temporary overlay that lives
          # as long as QEMU, not into the firmware file
          disk_opts: snapshot=on
      - ShellDriver:
          login_prompt: Please press Enter to activate this console.
          prompt: 'root@[\w()]+:[^ ]+ '
          await_login_timeout: 15
          username: root
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
      - QEMUNetworkStrategy: {}
tools:
  qemu_bin: qemu-system-arm
imports:
  - ../strategies/qemunetworkstrategy.py
