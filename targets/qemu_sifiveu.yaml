openwrt:
  name: QEMU RISC-V SiFive Unleashed
  target: sifiveu-generic
  profile: sifive_unleashed
  # initramfs images for sifiveu are only built on snapshots so far
  snapshots_only: true
targets:
  main:
    resources:
      - NetworkService:
          # The actual address will be filled in by the strategy
          address: ""
          port: 22
          username: root
    drivers:
      - QEMUDriver:
          qemu_bin: qemu_bin
          # QEMU's sifive_u machine emulates the FU540 SoC of the Unleashed
          # board, including its Cadence GEM Ethernet (macb) and SiFive UART.
          # OpenSBI is loaded as the default -bios.
          machine: sifive_u
          memory: 512M
          kernel: firmware
          boot_args: "console=ttySIF0,115200"
          # The onboard GEM is the only NIC, so there is no WAN port
          nic: user,net=192.168.1.0/24,id=lan
      - ShellDriver:
          login_prompt: Please press Enter to activate this console.
          prompt: 'root@[\w()]+:[^ ]+ '
          await_login_timeout: 15
          username: root
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
      - QEMUNetworkStrategy: {}
tools:
  qemu_bin: qemu-system-riscv64
imports:
  - ../strategies/qemunetworkstrategy.py
