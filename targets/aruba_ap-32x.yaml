openwrt:
  name: Aruba AP-32x
  target: ipq806x-generic
  profile: aruba_ap-32x
targets:
  main:
    features:
      - wifi-2g
      - wifi-5g
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      - PDUDaemonDriver: {}
      - TFTPProviderDriver: {}
      - SerialDriver:
          txdelay: 0.01
      - SmallUBootDriver:
          boot_expression: "Hit <Enter> to stop autoboot"
          interrupt: "\n"
          prompt: "apboot> "
          boot_command: tftpboot
          # TFTP download of the initramfs can take ~30 s on slower lab
          # links (dnsmasq-tftp over USB ethernet); the default budget
          # expires right before the kernel's first console line.
          boot_timeout: 120
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - UBootTFTPStrategy: {}
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
