openwrt:
  name: QEMU x86 32-bit (EFI)
  target: x86-generic
  profile: generic
  image:
    type: combined-efi
    filesystem: squashfs
  # 32-bit UEFI firmware (OVMF ia32); conftest.py adds it as pflash drives
  # (code, vars)
  efi_firmware: i386

targets:
  main:
    features:
      - wan_port
      - rootfs
      - sysupgrade

    resources:
      - NetworkService:
          # The actual address will be filled in by the strategy
          address: ""
          port: 22
          username: root

    drivers:
      - QEMUDriver:
          qemu_bin: qemu_bin
          machine: pc
          cpu: max
          # 128M is too little under OVMF: "EFI stub: ERROR: Failed to
          # decompress kernel" (seen on x86-64)
          memory: 256M
          extra_args: "-device virtio-rng-pci -netdev user,id=wan -device virtio-net-pci,netdev=wan"
          nic: user,model=virtio-net-pci,net=192.168.1.0/24,id=lan
          disk: firmware
          # Writes (overlay, sysupgrade) go to a temporary overlay that lives
          # as long as QEMU, not into the firmware file
          disk_opts: snapshot=on
      - ShellDriver:
          login_prompt: Please press Enter to activate this console.
          prompt: 'root@[\w()]+:[^ ]+ '
          await_login_timeout: 15
          username: root
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
      - QEMUNetworkStrategy: {}

tools:
  qemu_bin: qemu-system-i386

imports:
  - ../strategies/qemunetworkstrategy.py
