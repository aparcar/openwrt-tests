openwrt:
  name: Raspberry Pi 3A+/3B/3B+/CM3/Zero2/Zero2W/CM0 (64bit)
  target: bcm27xx-bcm2710
  profile: rpi-3
  image:
    type: factory
    filesystem: squashfs
targets:
  main:
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      PDUDaemonDriver: {}
      SerialDriver:
        txdelay: 0.05
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      USBSDMuxDriver: {}
      USBStorageDriver: {}
      SDMuxStrategy: {}
      SSHDriver:
        connection_timeout: 120.0
        explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/sdmuxstrategy.py
