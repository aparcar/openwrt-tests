## XikeStor SKS8300-12X V1 (19" case): RTL9313, 512M RAM, 32M NOR, 12x 10G
## SFP+, RS-232 console on the RJ45 port. Boots the initramfs from U-Boot
## over TFTP on SFP+ port 1 (openwrt/openwrt commit 81b148fd38).
## The bootloader runs at 9600 baud, OpenWrt at 115200: switch the bootloader
## once by hand (Ctrl+B, Ctrl+F, password, `baudrate 115200`) so one serial
## speed fits both.
## U-Boot sits behind the vendor CLI: Ctrl+B stops autoboot, Ctrl+F asks for
## the password, then `debug_unish_env` opens the U-Boot prompt.
## Bootloader "U-boot version: V2.00" prints "Hit Ctrl+B to stop autoboot"
## (1 s), at 9600 until switched.
## shortcut: password prompt, both prompts and the debug_unish_env step
## aren't covered or checked yet; likely needs a strategy step that runs
## debug_unish_env before U-Boot's prompt.
openwrt:
  name: XikeStor SKS8300-12X V1
  target: realtek-rtl931x
  profile: xikestor_sks8300-12x-v1
  # in no release yet (not in 25.12)
  snapshots_only: true
targets:
  main:
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      PDUDaemonDriver: {}
      TFTPProviderDriver: {}
      SerialDriver:
        txdelay: 0.01
      UBootDriver:
        autoboot: "Hit Ctrl+B to stop autoboot"
        interrupt: "\x02\x06"
        password: diagshell_unipoe_env
        prompt: 'RTL93\d\d# '
        init_commands:
          ## SFP+ port 1: fiber1g for a 1G module, fiber10g for 10GBase-*R
          ## (or the DAC type); then the RTL8231 holding the SFP GPIOs, then
          ## tx-disable of port 1 low
          - rtk 10g 0 fiber1g
          - rtk ext-devInit 0
          - rtk ext-pinSet 2 0
          - tftpboot 0x82000000
        boot_command: bootm 0x82000000
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      UBootTFTPStrategy: {}
      SSHDriver:
        connection_timeout: 120.0
        explicit_scp_mode: True

images:
  root: !template $LG_IMAGE

imports:
  - ../strategies/tftpstrategy.py
