openwrt:
  name: Linksys E8450 / Belkin RT3200 (UBI)
  target: mediatek-mt7622
  # The UBI layout (OpenWrt's U-Boot, which sets $bootconf below). The
  # non-UBI image reads the radios' calibration data from a raw factory
  # partition that isn't there on UBI boards: random MAC, no 5 GHz radio
  profile: linksys_e8450-ubi
targets:
  main:
    features:
      - wan_port
      - wifi-2g
      - wifi-5g
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      PDUDaemonDriver: {}
      TFTPProviderDriver: {}
      SerialDriver:
        txdelay: 0.01
      UBootDriver:
        interrupt: "\\x0"
        prompt: "MT7622>"
        init_commands:
          - tftpboot
        boot_command: bootm $loadaddr#$bootconf
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      UBootTFTPStrategy: {}
      SSHDriver:
        connection_timeout: 120.0
        explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
