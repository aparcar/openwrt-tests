targets:
  main:
    resources:
      - NetworkService:
          # The actual address will be filled in by the strategy
          address: ""
          port: 22
          username: root

    drivers:
      - QEMUDriver:
          qemu_bin: qemu_bin
          machine: virt
          cpu: cortex-a57
          memory: 128M
          kernel: firmware
          extra_args: "-device virtio-rng-pci -netdev user,id=lan -device virtio-net-pci,netdev=lan"
      - ShellDriver:
          login_prompt: Please press Enter to activate this console.
          prompt: 'root@[\w()]+:[^ ]+ '
          await_login_timeout: 15
          username: root
      - SSHDriver:
          explicit_scp_mode: True
      - QEMUNetworkStrategy: {}

tools:
  qemu_bin: qemu-system-aarch64

imports:
  - ../strategies/qemunetworkstrategy.py
