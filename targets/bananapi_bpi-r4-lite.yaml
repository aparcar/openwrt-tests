openwrt:
  name: Bananapi BPi-R4 Lite
  target: mediatek-filogic
  profile: bananapi_bpi-r4-lite
targets:
  main:
    features:
      - wan_port
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      - PDUDaemonDriver: {}
      - TFTPProviderDriver: {}
      - SerialDriver:
          txdelay: 0.01
      - UBootDriver:
          interrupt: "\\x0"
          prompt: "MT7987>"
          init_commands:
            - tftpboot
          # as the board's own boot (boot_update_conf): the 1pcie-2L overlay
          # sets the PCIe lane switch (GPIO 11), without it the Wi-Fi card
          # in the slot (MT7996, 14c3:7990) never links up
          boot_command: bootm $loadaddr#config-mt7987a-bananapi-bpi-r4-lite#mt7987a-bananapi-bpi-r4-lite-1pcie-2L
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - UBootTFTPStrategy: {}
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
