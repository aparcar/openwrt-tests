openwrt:
  name: Enterasys WS-AP3710i
  target: mpc85xx-p1020
  profile: enterasys_ws-ap3710i
  # 24.10/25.12 initramfs hangs after "Uncompressing Kernel Image ... OK": the
  # simpleImage loader is linked at 0x1500000 and the kernel outgrew it
  # (https://github.com/openwrt/openwrt/issues/25302; main relocated it to
  # 0x3000000, 25.12 via #26565). 23.05 is the last release that boots here.
  # Drop the pin once a 25.12 release with the fix boots.
  healthcheck_version: "23.05.5"
targets:
  main:
    features:
      - wifi-2g
      - wifi-5g
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      PDUDaemonDriver: {}
      SerialDriver:
        txdelay: 0.1
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      UBootDriver:
        autoboot: "or any other key to stop autoboot"
        interrupt: "\x08admin\n"
        prompt: "Boot \\(PRI\\)->"
        password_prompt: "password:"
        password: "new2day"
        init_commands:
          - tftp 0x1000000
        boot_command: >
          bootm

      TFTPProviderDriver: {}
      UBootTFTPStrategy: {}
      SSHDriver:
        connection_timeout: 120.0
        explicit_scp_mode: True
images:
  root: !template $LG_IMAGE
imports:
  - ../strategies/tftpstrategy.py
