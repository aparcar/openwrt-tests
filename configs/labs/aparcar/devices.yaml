# Device inventory for aparcar lab
# Lists all devices available in this lab with their capabilities
#
# This file is used by the KernelCI scheduler to determine which
# devices can run which tests.

lab_name: labgrid-aparcar

devices:
  # OpenWrt One - MediaTek MT7981B SoC
  - name: labgrid-aparcar-openwrt_one
    device_type: openwrt_one
    target_file: openwrt_one.yaml
    capabilities:
      - wan_port
      - wifi
    test_types:
      - firmware

  # Banana Pi BPI-R4 Lite - MediaTek MT7988A SoC
  - name: labgrid-aparcar-bananapi_bpi-r4-lite
    device_type: bananapi_bpi-r4-lite
    target_file: bananapi_bpi-r4-lite.yaml
    capabilities:
      - wan_port
    test_types:
      - firmware

  # Banana Pi BPI-R4 - MediaTek MT7988A SoC
  - name: labgrid-aparcar-bananapi_bpi-r4
    device_type: bananapi_bpi-r4
    target_file: bananapi_bpi-r4.yaml
    capabilities:
      - wan_port
    test_types:
      - firmware
      - kselftest

  # Raspberry Pi 4 - Broadcom BCM2711 SoC
  - name: labgrid-aparcar-rpi-4
    device_type: rpi-4
    target_file: rpi-4.yaml
    capabilities:
      - wan_port
    provisioning: sdmux
    test_types:
      - firmware

  # Genexis Pulse EX400 - Realtek RTL9303 SoC
  - name: labgrid-aparcar-genexis_pulse-ex400
    device_type: genexis_pulse-ex400
    target_file: genexis_pulse-ex400.yaml
    capabilities:
      - wan_port
    test_types:
      - firmware

  # TP-Link TL-WDR3600 v1 - Qualcomm Atheros AR9344 SoC
  - name: labgrid-aparcar-tplink_tl-wdr3600-v1
    device_type: tplink_tl-wdr3600-v1
    target_file: tplink_tl-wdr3600-v1.yaml
    capabilities:
      - wan_port
      - wifi
    test_types:
      - firmware
