# KernelCI API (Maestro) Configuration
#
# Mounted into the kernelci-api container at /home/kernelci/config/kernelci.toml
# Secrets are injected via environment variables (defined in .env file).

[server]
host = "0.0.0.0"
port = 8000

[database]
service_env = "MONGO_SERVICE"
name = "kernelci"

[redis]
host_env = "REDIS_HOST"
port = 6379

[jwt]
secret_key_env = "SECRET_KEY"
algorithm = "HS256"
access_token_expire_minutes = 480

[cors]
allow_origins = ["*"]
allow_methods = ["*"]
allow_headers = ["*"]
