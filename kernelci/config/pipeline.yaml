# =============================================================================
# OpenWrt KernelCI Pipeline Configuration
# =============================================================================
#
# This file configures the pipeline services for OpenWrt firmware testing:
# - Firmware source watchers
# - Test scheduling
# - Health check automation
# - Result collection
#
# =============================================================================

# API connection settings
api:
  local:
    url: ${KCI_API_URL:-http://kernelci-api:8000}
    token: ${KCI_API_TOKEN}

# =============================================================================
# Tree and Branch Configuration
# =============================================================================
#
# Tree: openwrt
# Branches are discovered dynamically from:
#   https://downloads.openwrt.org/.versions.json
#
# This automatically picks up:
#   - main        -> SNAPSHOT builds
#   - stable      -> Current release (e.g., 24.10.0)
#   - oldstable   -> Previous release series (e.g., 23.05.5)
#
tree:
  name: openwrt
  url: https://git.openwrt.org/openwrt/openwrt.git

# =============================================================================
# Firmware Source Watchers
# =============================================================================

firmware_sources:
  # Official OpenWrt releases (versions fetched from .versions.json)
  official:
    enabled: true
    type: openwrt_releases

    # Include snapshot (main branch) builds
    include_snapshot: true

    # Include oldstable (previous release series)
    include_oldstable: true

    # Check interval in seconds
    check_interval: 3600  # 1 hour for snapshots, 24h for releases

    # Targets to scan for firmware
    # These are checked for all active branches
    targets:
      - x86/64
      - armsr/armv8

  # GitHub Pull Request builds
  github_pr:
    enabled: true
    type: github_artifacts
    repository: openwrt/openwrt
    token: ${GITHUB_TOKEN}
    # Only process PRs with specific labels
    trigger_labels:
      - ci-test-requested
      - needs-testing
    # Workflow that produces firmware artifacts
    workflow_name: Build
    artifact_pattern: "openwrt-*"
    check_interval: 300  # 5 minutes

  # Custom firmware uploads via API
  custom:
    enabled: true
    type: api_upload
    max_file_size: 104857600  # 100MB
    allowed_extensions:
      - .bin
      - .img
      - .itb
      - .gz
    validation:
      require_target: true
      require_profile: true

  # Buildbot integration (webhook-based)
  buildbot:
    enabled: false  # Enable when buildbot is configured
    type: webhook
    endpoint: /api/v1/webhook/buildbot
    secret: ${BUILDBOT_WEBHOOK_SECRET}

# =============================================================================
# Test Types
# =============================================================================
#
# Currently implemented:
#   - firmware: All tests from aparcar/openwrt-tests.git/tests/ run as a
#     single pytest session. One job per device, adapter runs all tests.
#
# Not yet implemented:
#   - kselftest: Linux kernel selftests (requires custom firmware images
#     with kselftests-* packages installed)
#
test_types:
  firmware:
    name: Firmware Tests
    description: OpenWrt firmware tests from openwrt-tests.git/tests/
    repository: https://github.com/aparcar/openwrt-tests.git
    timeout: 1800

  kselftest:
    name: Kernel Selftests
    description: Linux kernel selftests (not yet implemented)
    repository: https://github.com/aparcar/openwrt-tests.git
    timeout: 1800
    enabled: false

# =============================================================================
# Scheduler Configuration
# =============================================================================

scheduler:
  # Maximum jobs to queue at once
  max_queue_size: 100

  # Maximum concurrent jobs per lab
  max_concurrent_per_lab: 3

  # Job timeout (seconds) - jobs exceeding this are marked failed
  job_timeout: 3600

  # Enabled test types
  # - firmware: Standard OpenWrt functionality tests
  # - kselftest: Linux kernel validation tests (requires custom images)
  enabled_test_types:
    - firmware
    # - kselftest  # Enable when kselftest packages are available

  # Priority values (higher = more urgent)
  priorities:
    health_check: 10
    pr_builds: 9
    custom: 8
    snapshot: 5
    stable: 3
    oldstable: 2

# =============================================================================
# Health Check Configuration
# =============================================================================

health_check:
  enabled: true

  # Check interval (seconds)
  interval: 86400  # 24 hours

  # Failure thresholds
  warning_threshold: 3
  disable_threshold: 5

  # Tests to run for health check
  test_plan: health_check

  # Notification settings
  notifications:
    github_issues:
      enabled: true
      repository: ${GITHUB_REPO:-openwrt/openwrt}
      labels:
        - device-failure
        - health-check
      auto_close: true

    email:
      enabled: false
      recipients: []

    slack:
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL}

# =============================================================================
# Device Type Mapping
# =============================================================================
#
# Maps labgrid target names to OpenWrt target/subtarget/profile
# This allows the scheduler to match firmware to compatible devices
#
# Each device has:
#   - target/subtarget/profile: OpenWrt build target
#   - features: Used for firmware test plan selection
#   - capabilities: Used for test type filtering (firmware vs kselftest)
#
# Capabilities for test types:
#   - serial_console: Required for all tests
#   - isolated_network: Required for kselftest_net (no external network)
#   - loopback_ethernet: Optional for some network tests
#   - high_memory: Device has >= 512MB RAM
#
device_types:
  qemu_x86-64:
    target: x86
    subtarget: "64"
    profile: generic
    features:
      - wan_port
      - rootfs
    capabilities:
      - serial_console
      - isolated_network
      - high_memory

  qemu_armsr-armv8:
    target: armsr
    subtarget: armv8
    profile: generic
    features:
      - wan_port
    capabilities:
      - serial_console
      - isolated_network
      - high_memory

# =============================================================================
# Results Collection
# =============================================================================

results:
  # Store console logs
  store_console_logs: true

  # Store test artifacts
  store_artifacts: true

  # Log retention (days)
  log_retention_days: 90

  # Compress logs older than (days)
  compress_after_days: 7
