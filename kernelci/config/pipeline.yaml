# =============================================================================
# OpenWrt KernelCI Pipeline Configuration
# =============================================================================
#
# This file configures the pipeline services for OpenWrt firmware testing:
# - Firmware source watchers
# - Test scheduling
# - Health check automation
# - Result collection
#
# =============================================================================

# API connection settings
api:
  local:
    url: ${KCI_API_URL:-http://kernelci-api:8001}
    token: ${KCI_API_TOKEN}

# Storage configuration
storage:
  minio:
    type: s3
    endpoint: ${MINIO_ENDPOINT:-minio:9000}
    access_key: ${MINIO_ACCESS_KEY}
    secret_key: ${MINIO_SECRET_KEY}
    secure: false
    buckets:
      firmware: openwrt-firmware
      logs: openwrt-logs
      artifacts: openwrt-artifacts

# =============================================================================
# Tree and Branch Configuration
# =============================================================================
#
# Tree: openwrt
# Branches are discovered dynamically from:
#   https://downloads.openwrt.org/.versions.json
#
# This automatically picks up:
#   - main        -> SNAPSHOT builds
#   - stable      -> Current release (e.g., 24.10.0)
#   - oldstable   -> Previous release series (e.g., 23.05.5)
#
tree:
  name: openwrt
  url: https://git.openwrt.org/openwrt/openwrt.git

# =============================================================================
# Firmware Source Watchers
# =============================================================================

firmware_sources:
  # Official OpenWrt releases (versions fetched from .versions.json)
  official:
    enabled: true
    type: openwrt_releases

    # Include snapshot (main branch) builds
    include_snapshot: true

    # Include oldstable (previous release series)
    include_oldstable: true

    # Check interval in seconds
    check_interval: 3600  # 1 hour for snapshots, 24h for releases

    # Targets to scan for firmware
    # These are checked for all active branches
    targets:
      - ath79/generic
      - ramips/mt7621
      - mediatek/filogic
      - x86/64
      - armsr/armv8
      - malta/be

  # GitHub Pull Request builds
  github_pr:
    enabled: true
    type: github_artifacts
    repository: openwrt/openwrt
    token: ${GITHUB_TOKEN}
    # Only process PRs with specific labels
    trigger_labels:
      - ci-test-requested
      - needs-testing
    # Workflow that produces firmware artifacts
    workflow_name: Build
    artifact_pattern: "openwrt-*"
    check_interval: 300  # 5 minutes

  # Custom firmware uploads via API
  custom:
    enabled: true
    type: api_upload
    max_file_size: 104857600  # 100MB
    allowed_extensions:
      - .bin
      - .img
      - .itb
      - .gz
    validation:
      require_target: true
      require_profile: true

  # Buildbot integration (webhook-based)
  buildbot:
    enabled: false  # Enable when buildbot is configured
    type: webhook
    endpoint: /api/v1/webhook/buildbot
    secret: ${BUILDBOT_WEBHOOK_SECRET}

# =============================================================================
# Test Plans
# =============================================================================

test_plans:
  base:
    name: Base Tests
    description: Basic boot and connectivity tests
    tests:
      - test_shell
      - test_ssh
      - test_firmware_version
      - test_ubus_system_board
      - test_free_memory
      - test_kernel_errors
    timeout: 600
    required_features: []

  system:
    name: System Health
    description: System resource validation
    tests:
      - test_memory_usage
      - test_filesystem_usage
      - test_system_uptime
      - test_process_count
      - test_entropy_available
    timeout: 300
    required_features: []

  network:
    name: Network Tests
    description: Network functionality tests
    tests:
      - test_lan_interface_address
      - test_wan_wait_for_network
      - test_https_download
    timeout: 600
    required_features:
      - wan_port
      - online

  wifi:
    name: WiFi Tests
    description: Wireless functionality tests
    tests:
      - test_wifi_scan
      - test_wifi_wpa2
      - test_wifi_wpa3
    timeout: 900
    required_features:
      - wifi

  wifi_hwsim:
    name: WiFi HWSIM Tests
    description: WiFi tests using mac80211_hwsim
    tests:
      - test_wifi_hwsim_sae_mixed
    timeout: 600
    required_features:
      - hwsim

  package_opkg:
    name: OPKG Tests
    description: OPKG package manager tests
    tests:
      - test_opkg_procd_installed
      - test_opkg_install_ucert
    timeout: 300
    required_features:
      - opkg
      - online

  package_apk:
    name: APK Tests
    description: APK package manager tests
    tests:
      - test_apk_procd_installed
      - test_apk_add_ucert
      - test_apk_audit
    timeout: 300
    required_features:
      - apk
      - online

  health_check:
    name: Health Check
    description: Quick device health verification
    tests:
      - test_shell
      - test_ssh
    timeout: 300
    required_features: []
    skip_firmware_flash: true

  # ==========================================================================
  # Kernel Selftest Plans
  # ==========================================================================
  # These require custom images with kselftest packages installed

  kselftest_net:
    name: Kernel Network Tests
    description: Linux kernel networking subsystem tests
    tests:
      - kselftest_net
    timeout: 1800
    required_features: []
    test_type: kselftest

  kselftest_timers:
    name: Kernel Timer Tests
    description: Linux kernel timer subsystem tests
    tests:
      - kselftest_timers
    timeout: 600
    required_features: []
    test_type: kselftest

  kselftest_seccomp:
    name: Kernel Seccomp Tests
    description: Linux kernel seccomp filter tests
    tests:
      - kselftest_seccomp
    timeout: 600
    required_features: []
    test_type: kselftest

  kselftest_size:
    name: Kernel Size Tests
    description: Linux kernel binary size validation
    tests:
      - kselftest_size
    timeout: 300
    required_features: []
    test_type: kselftest

# =============================================================================
# Scheduler Configuration
# =============================================================================

scheduler:
  # Maximum jobs to queue at once
  max_queue_size: 100

  # Maximum concurrent jobs per lab
  max_concurrent_per_lab: 3

  # Job timeout (seconds) - jobs exceeding this are marked failed
  job_timeout: 3600

  # Enabled test types
  # - firmware: Standard OpenWrt functionality tests
  # - kselftest: Linux kernel validation tests (requires custom images)
  enabled_test_types:
    - firmware
    # - kselftest  # Enable when kselftest packages are available

  # Priority values (higher = more urgent)
  priorities:
    health_check: 10
    pr_builds: 9
    custom: 8
    snapshot: 5
    stable: 3
    oldstable: 2

  # Default test plans by firmware source
  default_test_plans:
    snapshot:
      - base
      - system
    stable:
      - base
      - system
      - network
    oldstable:
      - base
    pr_builds:
      - base
      - system
    custom:
      - base

  # Additional test plans based on device features
  feature_test_plans:
    wifi:
      - wifi
    hwsim:
      - wifi_hwsim
    opkg:
      - package_opkg
    apk:
      - package_apk
    wan_port:
      - network

# =============================================================================
# Health Check Configuration
# =============================================================================

health_check:
  enabled: true

  # Check interval (seconds)
  interval: 86400  # 24 hours

  # Failure thresholds
  warning_threshold: 3
  disable_threshold: 5

  # Tests to run for health check
  test_plan: health_check

  # Notification settings
  notifications:
    github_issues:
      enabled: true
      repository: ${GITHUB_REPO:-openwrt/openwrt}
      labels:
        - device-failure
        - health-check
      auto_close: true

    email:
      enabled: false
      recipients: []

    slack:
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL}

# =============================================================================
# Device Type Mapping
# =============================================================================
#
# Maps labgrid target names to OpenWrt target/subtarget/profile
# This allows the scheduler to match firmware to compatible devices
#
# Each device has:
#   - target/subtarget/profile: OpenWrt build target
#   - features: Used for firmware test plan selection
#   - capabilities: Used for test type filtering (firmware vs kselftest)
#
# Capabilities for test types:
#   - serial_console: Required for all tests
#   - isolated_network: Required for kselftest_net (no external network)
#   - loopback_ethernet: Optional for some network tests
#   - high_memory: Device has >= 512MB RAM
#
device_types:
  # QEMU targets - good for kselftest (isolated, configurable resources)
  qemu_x86-64:
    target: x86
    subtarget: "64"
    profile: generic
    features:
      - wan_port
      - rootfs
    capabilities:
      - serial_console
      - isolated_network
      - high_memory

  qemu_malta-be:
    target: malta
    subtarget: be
    profile: generic
    features:
      - wan_port
    capabilities:
      - serial_console
      - isolated_network

  qemu_armsr-armv8:
    target: armsr
    subtarget: armv8
    profile: generic
    features:
      - wan_port
    capabilities:
      - serial_console
      - isolated_network
      - high_memory

  # Real hardware - primarily for firmware testing
  # Add isolated_network capability if device is on dedicated test network
  openwrt_one:
    target: mediatek
    subtarget: filogic
    profile: openwrt_one
    features:
      - wifi
      - wan_port
    capabilities:
      - serial_console

  bananapi_bpi-r4:
    target: mediatek
    subtarget: filogic
    profile: bananapi_bpi-r4
    features:
      - wifi
      - wan_port
    capabilities:
      - serial_console
      - high_memory

  linksys_e8450:
    target: mediatek
    subtarget: mt7622
    profile: linksys_e8450-ubi
    features:
      - wifi
      - wan_port
    capabilities:
      - serial_console

  glinet_gl-mt6000:
    target: mediatek
    subtarget: filogic
    profile: glinet_gl-mt6000
    features:
      - wifi
      - wan_port
    capabilities:
      - serial_console
      - high_memory

  tplink_archer-c7-v2:
    target: ath79
    subtarget: generic
    profile: tplink_archer-c7-v2
    features:
      - wifi
      - wan_port
    capabilities:
      - serial_console

  raspberry_pi_4:
    target: bcm27xx
    subtarget: bcm2711
    profile: rpi-4
    features:
      - wan_port
    capabilities:
      - serial_console
      - high_memory

# =============================================================================
# Results Collection
# =============================================================================

results:
  # Store console logs
  store_console_logs: true

  # Store test artifacts
  store_artifacts: true

  # Log retention (days)
  log_retention_days: 90

  # Compress logs older than (days)
  compress_after_days: 7
