# OpenWrt KernelCI - Self-Hosted Testing Infrastructure
#
# Full stack: Maestro (job orchestration) + KCIDB (result storage) + Dashboard
#
# Prerequisites:
#   git clone https://github.com/kernelci/kcidb-ng kcidb-ng
#   git clone https://github.com/kernelci/dashboard dashboard
#   cp .env.example .env   # then fill in secrets
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f

services:
  # ---------------------------------------------------------------------------
  # Maestro: Job Orchestration (MongoDB + Redis + API)
  # ---------------------------------------------------------------------------

  mongodb:
    image: mongo:7.0
    container_name: openwrt-kci-mongodb
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  maestro-redis:
    image: redis:7-alpine
    container_name: openwrt-kci-maestro-redis
    command: redis-server --appendonly yes
    volumes:
      - maestro_redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kernelci-api:
    image: ghcr.io/kernelci/kernelci-api:latest
    container_name: openwrt-kci-api
    depends_on:
      mongodb:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${KCI_SECRET_KEY:?KCI_SECRET_KEY is required}
      MONGO_SERVICE: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017
      REDIS_HOST: maestro-redis
      REDIS_PORT: 6379
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    volumes:
      - ./config/api-config.toml:/home/kernelci/config/kernelci.toml:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # Pipeline: Firmware Trigger + Test Scheduler + KCIDB Bridge
  # ---------------------------------------------------------------------------

  pipeline-trigger:
    build:
      context: ./openwrt-scheduler
      dockerfile: Dockerfile
    container_name: openwrt-kci-trigger
    depends_on:
      kernelci-api:
        condition: service_healthy
    environment:
      KCI_API_URL: http://kernelci-api:8000
      KCI_API_TOKEN: ${KCI_API_TOKEN:?KCI_API_TOKEN is required}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config/pipeline.yaml:/app/config/pipeline.yaml:ro
      - firmware_cache:/app/cache
    command: ["python", "-m", "openwrt_scheduler.firmware_trigger"]
    networks:
      - internal
    restart: unless-stopped

  pipeline-scheduler:
    build:
      context: ./openwrt-scheduler
      dockerfile: Dockerfile
    container_name: openwrt-kci-scheduler
    depends_on:
      kernelci-api:
        condition: service_healthy
    environment:
      KCI_API_URL: http://kernelci-api:8000
      KCI_API_TOKEN: ${KCI_API_TOKEN}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config/pipeline.yaml:/app/config/pipeline.yaml:ro
    command: ["python", "-m", "openwrt_scheduler.test_scheduler"]
    networks:
      - internal
    restart: unless-stopped

  kcidb-bridge:
    build:
      context: ./openwrt-scheduler
      dockerfile: Dockerfile
    container_name: openwrt-kci-bridge
    depends_on:
      kernelci-api:
        condition: service_healthy
      kcidb-rest:
        condition: service_started
    environment:
      KCI_API_URL: http://kernelci-api:8000
      KCI_API_TOKEN: ${KCI_API_TOKEN}
      KCIDB_URL: http://kcidb-rest:80
      KCIDB_ORIGIN: ${KCIDB_ORIGIN:-openwrt}
      KCIDB_SECRET: ${KCIDB_JWT_SECRET:?KCIDB_JWT_SECRET is required}
      POLL_INTERVAL: "60"
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "openwrt_scheduler.kcidb_bridge"]
    networks:
      - internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Storage: MinIO (S3-compatible, for test logs and artifacts)
  # ---------------------------------------------------------------------------

  minio:
    image: minio/minio:latest
    container_name: openwrt-kci-minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-openwrt}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  minio-init:
    image: minio/mc:latest
    container_name: openwrt-kci-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-openwrt}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing minio/test-logs;
      mc anonymous set download minio/test-logs;
      echo 'MinIO buckets initialized';
      "
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # KCIDB: Result Storage (PostgreSQL + REST + Ingester)
  # ---------------------------------------------------------------------------

  kcidb-db:
    image: postgres:17
    container_name: openwrt-kci-kcidb-db
    environment:
      POSTGRES_PASSWORD: ${KCIDB_PG_PASSWORD:-kcidb}
    volumes:
      - kcidb_db_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kcidb-dbinit:
    build:
      context: ./config
      dockerfile: Dockerfile.dbinit
    container_name: openwrt-kci-kcidb-dbinit
    environment:
      PG_HOST: kcidb-db
      PGPASSWORD: ${KCIDB_PG_PASSWORD:-kcidb}
      PG_URI: "postgresql:dbname=kcidb user=kcidb_editor password=${KCIDB_PG_PASSWORD:-kcidb} host=kcidb-db port=5432"
    depends_on:
      kcidb-db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  kcidb-rest:
    build:
      context: ./kcidb-ng
      dockerfile: Dockerfile.kcidb-rest-rs
    container_name: openwrt-kci-kcidb-rest
    environment:
      JWT_SECRET: ${KCIDB_JWT_SECRET}
    volumes:
      - kcidb_spool:/app/spool
    networks:
      - internal
    restart: unless-stopped

  kcidb-ingester:
    build:
      context: ./kcidb-ng
      dockerfile: Dockerfile.django-ingester
    container_name: openwrt-kci-kcidb-ingester
    environment:
      DB_DEFAULT_HOST: kcidb-db
      DB_DEFAULT_USER: kcidb_editor
      DB_DEFAULT_NAME: kcidb
      DB_DEFAULT_PASSWORD: ${KCIDB_PG_PASSWORD:-kcidb}
      DB_DEFAULT_PORT: "5432"
      AGGREGATION_ENABLED: "True"
      AGGREGATION_INTERVAL: "60"
      DASH_DB_NAME: dashboard
      DASH_DB_USER: admin
      DASH_DB_PASSWORD: admin
      DASH_DB_HOST: dashboard-db
      DASH_DB_PORT: "5432"
      USE_DASHBOARD_DB: "True"
      REDIS_HOST: dashboard-redis
    volumes:
      - kcidb_spool:/app/spool
      - kcidb_state:/app/state
      - kcidb_cache:/app/cache
    depends_on:
      kcidb-db:
        condition: service_healthy
      kcidb-dbinit:
        condition: service_completed_successfully
      dashboard-db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard: Frontend + Backend + Redis
  # ---------------------------------------------------------------------------

  dashboard-db:
    image: postgres:17
    container_name: openwrt-kci-dashboard-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dashboard
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard-redis:
    image: redis:7-alpine
    container_name: openwrt-kci-dashboard-redis
    networks:
      - internal
    restart: unless-stopped

  dashboard-backend:
    build:
      context: ./dashboard/backend
      args:
        BACKEND_VOLUME_DIR: /volume_data
    container_name: openwrt-kci-dashboard-backend
    volumes:
      - dashboard_backend_data:/volume_data
      - ./config/dashboard-secrets:/run/secrets:ro
    environment:
      ALLOWED_HOSTS: '["dashboard-backend", "localhost"]'
      DB_DEFAULT_HOST: kcidb-db
      DB_DEFAULT_USER: kcidb_editor
      DB_DEFAULT_NAME: kcidb
      DB_DEFAULT_PASSWORD_FILE: /run/secrets/postgres_password_secret
      DJANGO_SECRET_KEY: ${KCI_SECRET_KEY}
      REDIS_HOST: dashboard-redis
      DEBUG: "False"
      DEFAULT_ORIGIN: ${KCIDB_ORIGIN:-openwrt}
      DASH_DB_NAME: dashboard
      DASH_DB_USER: admin
      DASH_DB_PASSWORD: admin
      DASH_DB_HOST: dashboard-db
      DASH_DB_PORT: "5432"
      USE_DASHBOARD_DB: "True"
    depends_on:
      - kcidb-db
      - dashboard-redis
      - dashboard-db
    networks:
      - internal
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ./dashboard/Dockerfile
    container_name: openwrt-kci-dashboard
    volumes:
      - dashboard_static:/data/static

  dashboard-proxy:
    build:
      context: ./dashboard/proxy
    container_name: openwrt-kci-dashboard-proxy
    environment:
      PROXY_TARGET: http://dashboard-backend:8000
    depends_on:
      - dashboard-backend
      - dashboard
    volumes:
      - dashboard_static:/data/static:ro
    networks:
      - internal
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # Reverse Proxy
  # ---------------------------------------------------------------------------

  traefik:
    image: traefik:v3.0
    container_name: openwrt-kci-proxy
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=openwrt-kci-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.org}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - internal
    restart: unless-stopped

volumes:
  mongodb_data:
    name: openwrt-kci-mongodb
  maestro_redis_data:
    name: openwrt-kci-maestro-redis
  minio_data:
    name: openwrt-kci-minio
  firmware_cache:
    name: openwrt-kci-firmware-cache
  kcidb_db_data:
    name: openwrt-kci-kcidb-db
  kcidb_spool:
    name: openwrt-kci-kcidb-spool
  kcidb_state:
    name: openwrt-kci-kcidb-state
  kcidb_cache:
    name: openwrt-kci-kcidb-cache
  dashboard_db_data:
    name: openwrt-kci-dashboard-db
  dashboard_backend_data:
    name: openwrt-kci-dashboard-backend
  dashboard_static:
    name: openwrt-kci-dashboard-static
  letsencrypt_data:
    name: openwrt-kci-letsencrypt

networks:
  internal:
    name: openwrt-kci-network
    driver: bridge
