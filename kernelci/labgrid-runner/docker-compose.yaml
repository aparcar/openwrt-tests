services:
  coordinator:
    build:
      context: .
      dockerfile: coordinator.Dockerfile
    container_name: labgrid-coordinator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "labgrid-client", "places"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - labgrid

  adapter:
    build: .
    container_name: labgrid-adapter
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      LAB_NAME: "${LAB_NAME:-qemu-runner}"
      KCI_API_URL: "${KCI_API_URL:-https://api.openwrt-kci.aparcar.org}"
      KCI_API_TOKEN: "${KCI_API_TOKEN}"
      LG_COORDINATOR: "coordinator:20408"
      POLL_INTERVAL: "${POLL_INTERVAL:-30}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      HEALTH_CHECK_ENABLED: "false"
      SUPPORTED_TEST_TYPES: "firmware"
      TARGETS_DIR: "/app/targets"
      TESTS_DIR: "/app/tests"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      MINIO_LOGS_BUCKET: "${MINIO_LOGS_BUCKET:-test-logs}"
    volumes:
      - ../../targets:/app/targets:ro
      - ../../tests:/app/tests:ro
      - ../../strategies:/app/strategies:ro
      - firmware-cache:/app/cache
    networks:
      - labgrid

volumes:
  firmware-cache:

networks:
  labgrid:
