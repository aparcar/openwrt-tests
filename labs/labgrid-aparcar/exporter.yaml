    cls: NetworkInterface
    ifname: vlan101
  NetworkService:
    address: 192.168.1.1%vlan102
    username: root
  PDUDaemonPort:
    host: localhost:16421
    index: 1
    pdu: labgrid-switch-1
  TFTPProvider:
    external: tftp://192.168.102.1/openwrt_one/
    internal: /srv/tftp/openwrt_one/
