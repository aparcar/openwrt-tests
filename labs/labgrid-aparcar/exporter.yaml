## UniFi Security Gateway. U-Boot fetches the initramfs over LAN 1 (octeth1),
## not the WAN port.
## FIXME: not wired. The ports below (switch 2 lan1 = LAN 1 + power, VLAN 125;
## lan2 = WAN 1, VLAN 126) now belong to the Genexis Pulse EX400 and switch 2
## is full, so pick free ports on switch 1 before adding this device to
## lab.yaml. The console port below (hub A 1.1.3) is now the Enterasys's.
labgrid-aparcar-ubnt_unifi-usg:
  wan:
    cls: NetworkInterface
    ifname: vlan126
  NetworkService:
    address: 192.168.1.1%vlan125
    username: root
  PDUDaemonPort:
    host: localhost:16421
    index: 1
    pdu: labgrid-switch-2
  TFTPProvider:
    external: tftp://192.168.125.1/ubnt_unifi-usg/
    internal: /srv/tftp/ubnt_unifi-usg/
  USBSerialPort:
    match:
      ID_PATH: platform-xhci-hcd.0-usb-0:1.1.3:1.0

## UniFi Cloud Gateway Fiber, for bring-up: OpenWrt publishes no image yet,
## so its healthcheck fails and CI schedules nothing on it; use it with a
## self-built initramfs. Powered from the Bluetooth power strip
## (the fourth socket; the strip counts from 0). LAN on switch 1 lan7, WAN on
## lan8.
labgrid-aparcar-ubnt_ucgfiber:
  wan:
    cls: NetworkInterface
    ifname: vlan108
  NetworkService:
    address: 192.168.1.1%vlan107
    username: root
  PDUDaemonPort:
    host: localhost:16421
    index: 3
    pdu: labgrid-strip-1
  TFTPProvider:
    external: tftp://192.168.107.1/ubnt_ucgfiber/
    internal: /srv/tftp/ubnt_ucgfiber/
  USBSerialPort:
    match:
      ID_PATH: platform-xhci-hcd.1-usb-0:2.3:1.0

## labgrid-probe (contrib/labgrid-probe): its own place, tagged role=probe.
## Tests reserve and lock it for the modules that use it and control it over
## HTTP (uhttpd /ubus on port 80), not SSH.
labgrid-aparcar-probe:
  NetworkService:
    address: 172.20.0.3
    port: 80
    username: root

labgrid-aparcar-wifi-probe:
  NetworkService:
    address: 172.20.0.4
    port: 80
    username: root

labgrid-aparcar-wifi-probe-2:
  NetworkService:
    address: 172.20.0.5
    port: 80
    username: root

## Android phone (Pixel 5) on this host's USB (contrib/android-probe,
## docs/android-probe.md): the tests SSH to this host as aprobe and run aprobe.
labgrid-aparcar-android-probe:
  NetworkService:
    address: localhost
    port: 22
    username: aprobe

## iPhone 7 (iOS 15, supervised) on this host's USB (contrib/iphone-probe,
## docs/iphone-probe.md): the tests SSH to this host as iprobe and run iprobe.
labgrid-aparcar-iphone-probe:
  NetworkService:
    address: localhost
    port: 22
    username: iprobe
