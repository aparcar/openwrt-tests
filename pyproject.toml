[project]
name = "tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ansible<15.0.0",
    "labgrid>=25.0",
    "pytest>=8.4.1",
    "pytest-check>=2.5.3",
]

[dependency-groups]
dev = ["isort>=6.0.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
# xunit2 has no per-test <properties>: record_property warns on every call
junit_family = "xunit1"
filterwarnings = [
    # pyserial(-labgrid) 3.5 rfc2217 calls Thread.setDaemon()/setName();
    # no newer release, drop once one fixes it
    "ignore:setDaemon\\(\\) is deprecated:DeprecationWarning:serial.rfc2217",
    "ignore:setName\\(\\) is deprecated:DeprecationWarning:serial.rfc2217",
]

[tool.uv.sources]
labgrid = { git = "https://github.com/aparcar/labgrid.git", branch = "staging" }
